<!DOCTYPE html>

<title>ParkITB Splash</title>

                    "tertiary-fixed": "#ffddb4",
                    "on-surface-variant": "#43474f",
                    "primary": "#002653",
                    "on-error-container": "#93000a",
                    "on-primary-container": "#8aa8e0",
                    "background": "#f8f9fb",
                    "on-secondary-fixed-variant": "#004884",
                    "on-tertiary-container": "#e4980e",
                    "primary-fixed": "#d7e3ff",
                    "inverse-surface": "#2e3132",
                    "surface-bright": "#f8f9fb",
                    "on-error": "#ffffff",
                    "tertiary-container": "#563600",
                    "surface-variant": "#e1e2e4",
                    "tertiary": "#392200",
                    "primary-container": "#1a3c6e",
                    "surface-tint": "#405e92",
                    "secondary-fixed": "#d4e3ff",
                    "inverse-primary": "#abc7ff",
                    "on-secondary": "#ffffff",
                    "on-tertiary": "#ffffff",
                    "on-primary": "#ffffff",

                    "inverse-on-surface": "#f0f1f3",
                    "surface-container-high": "#e7e8ea",
                    "surface-container-lowest": "#ffffff",
                    "outline-variant": "#c4c6d0",
                    "surface-container": "#edeef0",
                    "surface-container-low": "#f2f4f6",
                    "on-tertiary-fixed-variant": "#633f00",
                    "secondary": "#005fac",
                    "on-primary-fixed": "#001b3f",
                    "surface-container-highest": "#e1e2e4",

            "borderRadius": {

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Grainy texture overlay */
        .noise-overlay {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.02;
            pointer-events: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-primary overflow-hidden">
<!-- Main Splash Canvas -->
<main class="relative h-screen w-full flex items-center justify-center overflow-hidden bg-gradient-to-br from-[#002653] to-[#1A3C6E]">
<!-- Texture Layer -->
<div class="absolute inset-0 noise-overlay"></div>
<!-- Background Architectural Elements (Visual North Star: Digital Architect) -->
<div class="absolute -top-24 -right-24 w-96 h-96 rounded-full bg-secondary-container opacity-5 blur-3xl"></div>
<div class="absolute -bottom-32 -left-32 w-[500px] h-[500px] rounded-full bg-primary-container opacity-20 blur-3xl"></div>
<!-- Centered Branding Block -->
<div class="relative z-10 flex flex-col items-center gap-8 px-6 text-center">
<!-- Logo Cluster -->
<div class="flex flex-col items-center gap-6">
<!-- ITB Iconic Representation Container -->
<div class="w-24 h-24 bg-white/5 backdrop-blur-md rounded-2xl p-1 flex items-center justify-center shadow-2xl">
<div class="w-full h-full bg-white flex items-center justify-center rounded-xl">
<span class="material-symbols-outlined text-primary text-5xl" data-icon="account_balance" data-weight="fill" style="font-variation-settings: 'FILL' 1;">account_balance</span>
</div>
</div>
<!-- Typography Anchor (JSON Casing Integrity: ParkITB) -->
<div class="flex flex-col items-center">
<h1 class="font-headline font-bold text-5xl md:text-6xl tracking-tighter text-white drop-shadow-sm">
                        ParkITB
                    </h1>
<!-- Tagline (As specified) -->
<p class="font-body text-primary-fixed-dim text-lg md:text-xl font-medium mt-3 tracking-wide opacity-90">
                        Parkir cerdas, kampus lancar.
                    </p>
</div>
</div>
<!-- Institutional Prestige Accent (Golden Ratio Line) -->
<div class="w-12 h-1 bg-tertiary-fixed-dim rounded-full mt-4"></div>
<!-- Loading/Entry Indicator (Minimalist) -->
<div class="absolute bottom-[-160px] flex flex-col items-center gap-4">
<div class="w-48 h-1.5 bg-white/10 rounded-full overflow-hidden">
<div class="h-full w-1/3 bg-secondary-container rounded-full"></div>
</div>
<span class="font-label text-[10px] uppercase tracking-[0.2em] text-white/40">
                    Establishing Secure Connection
                </span>
</div>
</div>
<!-- Foreground Geometric Detail -->
<div class="absolute bottom-0 right-0 w-full md:w-1/2 h-1/4 opacity-10">
<svg class="w-full h-full" preserveaspectratio="none" viewbox="0 0 100 100">
<path d="M0 100 L100 0 L100 100 Z" fill="white"></path>
</svg>
</div>
</main>
<!-- Contextual Aesthetic Overlay for Image Replacement Logic -->
<div class="hidden">
<!-- Visual anchor for the design mood -->
<img data-alt="close-up of architectural concrete with sharp shadows and deep blue lighting reflecting institutional prestige and modern technology" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAxMq1P_wx4jJfD2WyAnN04fjVRhMKorRAsNaszgMxyYQ_Jw73N4EK5_GS2ti0BieppgIOzeC8ZWorCeiDmxoOJZogKhUx0FCXhWYH2BxU_qdFpSCOd1nkmSbrvPqatFMeFy2ZQqAf8aWzYfM39fXT9uAQ7CS85k6I8AvCcqK3nQxGZq8K8bwLbx7sDi2n2pQu5owjTnv6JEOBVJRjrd-MlRhEx5_B0g1gUuyLg01uVaGcCSiWCYaSIlfuXfv3ZRrxcVZ3wENDrYbQd"/>
</div>
