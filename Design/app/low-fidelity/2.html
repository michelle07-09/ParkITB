<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ParkITB - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed": "#5f5e5e",
                        "on-primary-container": "#ffffff",
                        "secondary-fixed": "#c6c6c6",
                        "inverse-on-surface": "#f1f1f1",
                        "tertiary-fixed": "#5d5f5f",
                        "on-surface-variant": "#474747",
                        "surface-container": "#eeeeee",
                        "secondary": "#5d5e5f",
                        "surface-dim": "#dadada",
                        "surface-container-lowest": "#ffffff",
                        "tertiary": "#3a3c3c",
                        "surface-bright": "#f9f9f9",
                        "inverse-primary": "#c8c6c6",
                        "on-tertiary-fixed": "#ffffff",
                        "on-primary": "#e4e2e1",
                        "surface-variant": "#e2e2e2",
                        "surface-container-low": "#f3f3f3",
                        "on-primary-fixed-variant": "#e4e2e1",
                        "outline-variant": "#c6c6c6",
                        "on-background": "#1a1c1c",
                        "on-tertiary-container": "#ffffff",
                        "surface-tint": "#5f5e5e",
                        "primary-container": "#3b3b3b",
                        "on-secondary-fixed-variant": "#3a3c3c",
                        "on-error-container": "#410002",
                        "on-secondary-container": "#1a1c1c",
                        "tertiary-container": "#737575",
                        "surface-container-high": "#e8e8e8",
                        "on-primary-fixed": "#ffffff",
                        "error": "#ba1a1a",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed-variant": "#e2e2e2",
                        "surface": "#f9f9f9",
                        "on-secondary": "#ffffff",
                        "secondary-container": "#d4d4d4",
                        "outline": "#777777",
                        "primary": "#000000",
                        "primary-fixed-dim": "#474747",
                        "error-container": "#ffdad6",
                        "inverse-surface": "#2f3131",
                        "background": "#f9f9f9",
                        "on-tertiary": "#e2e2e2",
                        "tertiary-fixed-dim": "#454747",
                        "secondary-fixed-dim": "#ababab",
                        "on-surface": "#1a1c1c",
                        "on-secondary-fixed": "#1a1c1c",
                        "surface-container-highest": "#e2e2e2"
                    },
                    "borderRadius": {
                        "DEFAULT": "0px",
                        "lg": "0px",
                        "xl": "0px",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
<style>
        body {
            background-color: #F9F9F9;
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .wireframe-x {
            background-image: linear-gradient(to top right, transparent calc(50% - 1px), #BDBDBD, transparent calc(50% + 1px)),
                              linear-gradient(to bottom right, transparent calc(50% - 1px), #BDBDBD, transparent calc(50% + 1px));
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex items-center justify-center min-h-screen bg-surface-container">
<!-- Mobile Container (390x844) -->
<div class="w-[390px] h-[844px] bg-surface relative flex flex-col overflow-hidden shadow-2xl">
<!-- Header Section (Asymmetric Editorial Style) -->
<header class="pt-20 px-6 pb-12 flex flex-col gap-2">
<div class="flex items-center gap-2 mb-4">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="local_parking">local_parking</span>
<span class="font-black text-2xl uppercase tracking-tighter text-primary">ParkITB</span>
</div>
<div class="flex flex-col">
<p class="text-[0.6875rem] font-medium uppercase tracking-[0.2em] text-outline mb-1">[ ACCESS PORTAL ]</p>
<h1 class="text-[2.75rem] font-black leading-[0.9] tracking-tighter text-primary">SECURE<br/>ENTRY</h1>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 px-6 flex flex-col gap-12">
<!-- Graphic Placeholder (Architectural Style) -->
<div class="w-full h-48 bg-surface-container-low border border-outline-variant/20 flex items-center justify-center relative">
<div class="absolute inset-0 wireframe-x opacity-10"></div>
<p class="text-[0.75rem] font-bold text-outline-variant uppercase tracking-widest bg-surface px-4 py-1 z-10">[ AUTHENTICATION_LAYER ]</p>
</div>
<!-- Form Section -->
<div class="flex flex-col gap-6">
<!-- Email Input Field -->
<div class="flex flex-col gap-2">
<label class="text-[0.6875rem] font-bold uppercase tracking-widest text-on-surface-variant px-1">[ Email Input Field ]</label>
<div class="relative">
<input class="w-full h-14 bg-surface-container-highest border-none text-on-surface placeholder:text-outline/50 font-medium text-sm focus:ring-2 focus:ring-primary ring-offset-2 ring-offset-surface px-4" placeholder="ADMIN@PARKITB.INTERNAL" type="email"/>
</div>
</div>
<!-- Password Input Field -->
<div class="flex flex-col gap-2">
<label class="text-[0.6875rem] font-bold uppercase tracking-widest text-on-surface-variant px-1">[ Password Input Field ]</label>
<div class="relative">
<input class="w-full h-14 bg-surface-container-highest border-none text-on-surface placeholder:text-outline/50 font-medium text-sm focus:ring-2 focus:ring-primary ring-offset-2 ring-offset-surface px-4" placeholder="••••••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline material-symbols-outlined text-sm" data-icon="visibility">visibility</button>
</div>
</div>
<!-- Action Section -->
<div class="mt-4 flex flex-col gap-4">
<!-- Login Button -->
<button class="w-full h-14 bg-primary text-on-primary font-black uppercase tracking-widest text-sm hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-2">
                        [ Login Button ]
                        <span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
</button>
<!-- Forgot Password -->
<a class="text-[0.6875rem] font-medium text-outline text-center uppercase tracking-widest hover:text-primary transition-colors" href="#">
                        Recovery Terminal
                    </a>
</div>
</div>
</main>
<!-- Footer / Register Link -->
<footer class="p-8 mt-auto bg-surface-container-low border-t border-outline-variant/10">
<div class="flex flex-col items-center gap-4">
<p class="text-[0.75rem] text-outline-variant uppercase tracking-tight">Need clearance?</p>
<!-- Register Link -->
<a class="inline-flex items-center gap-2 px-6 py-2 border border-primary text-primary font-bold text-[0.6875rem] uppercase tracking-[0.2em] hover:bg-primary hover:text-on-primary transition-all" href="#">
                    [ Register Link ]
                </a>
</div>
</footer>
<!-- Bottom Safe Area Indicator (Visual only) -->
<div class="h-1 bg-primary w-1/3 mx-auto mb-2 opacity-10"></div>
</div>
</body></html>
