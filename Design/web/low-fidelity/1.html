<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "inverse-surface": "#2f3131",
                    "secondary-fixed-dim": "#acabab",
                    "inverse-primary": "#c8c6c5",
                    "surface-bright": "#f9f9f9",
                    "inverse-on-surface": "#f1f1f1",
                    "tertiary": "#3a3c3c",
                    "surface-variant": "#e2e2e2",
                    "on-error-container": "#410002",
                    "outline": "#777777",
                    "surface-dim": "#dadada",
                    "on-tertiary": "#e3e2e2",
                    "surface": "#f9f9f9",
                    "tertiary-fixed": "#5d5e5f",
                    "surface-container-high": "#e8e8e8",
                    "on-surface-variant": "#474747",
                    "tertiary-container": "#747575",
                    "primary-fixed-dim": "#474746",
                    "on-secondary-container": "#1b1c1c",
                    "primary-container": "#3c3b3b",
                    "secondary-container": "#d5d4d4",
                    "primary": "#000000",
                    "background": "#f9f9f9",
                    "surface-tint": "#5f5e5e",
                    "secondary": "#5e5e5e",
                    "outline-variant": "#c6c6c6",
                    "error": "#ba1a1a",
                    "surface-container": "#eeeeee",
                    "surface-container-lowest": "#ffffff",
                    "on-secondary": "#ffffff",
                    "on-secondary-fixed-variant": "#3b3b3c",
                    "on-error": "#ffffff",
                    "on-tertiary-fixed-variant": "#e3e2e2",
                    "on-primary-fixed-variant": "#e5e2e1",
                    "on-tertiary-fixed": "#ffffff",
                    "on-background": "#1a1c1c",
                    "on-surface": "#1a1c1c",
                    "on-primary-fixed": "#ffffff",
                    "tertiary-fixed-dim": "#464747",
                    "on-tertiary-container": "#ffffff",
                    "secondary-fixed": "#c7c6c6",
                    "surface-container-highest": "#e2e2e2",
                    "primary-fixed": "#5f5e5e",
                    "on-primary-container": "#ffffff",
                    "error-container": "#ffdad6",
                    "on-primary": "#e5e2e1",
                    "surface-container-low": "#f3f3f3",
                    "on-secondary-fixed": "#1b1c1c"
            },
            "borderRadius": {
                    "DEFAULT": "0px",
                    "lg": "0px",
                    "xl": "0px",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Inter"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center p-6">
<div class="w-full max-w-[440px] flex flex-col items-center">
<!-- Logo and Brand Section -->
<div class="mb-12 text-center">
<div class="w-16 h-16 bg-primary flex items-center justify-center mb-6 mx-auto">
<span class="material-symbols-outlined text-on-primary text-4xl" data-icon="local_parking">local_parking</span>
</div>
<h1 class="text-4xl font-black tracking-tighter text-primary uppercase">ParkITB</h1>
<p class="text-on-surface-variant text-sm tracking-widest uppercase mt-2 font-medium">Integrated Parking Management</p>
</div>
<!-- Login Container -->
<div class="w-full bg-surface-container-lowest p-8 md:p-12 shadow-[0_0_0_1px_rgba(0,0,0,0.05)]">
<form class="space-y-8">
<!-- Email Field -->
<div class="group">
<label class="block text-[10px] font-bold uppercase tracking-widest text-secondary mb-2">Email Address</label>
<input class="w-full bg-surface-container-low border-b-2 border-transparent border-b-outline-variant focus:border-b-primary focus:ring-0 px-0 py-3 text-on-surface transition-all duration-200 placeholder:text-outline-variant placeholder:uppercase placeholder:text-[10px] outline-none" placeholder="example@itb.ac.id" type="email"/>
</div>
<!-- Password Field -->
<div class="group">
<label class="block text-[10px] font-bold uppercase tracking-widest text-secondary mb-2">Security Key</label>
<input class="w-full bg-surface-container-low border-b-2 border-transparent border-b-outline-variant focus:border-b-primary focus:ring-0 px-0 py-3 text-on-surface transition-all duration-200 placeholder:text-outline-variant outline-none" placeholder="••••••••" type="password"/>
</div>
<!-- Action Button -->
<div class="pt-4">
<button class="w-full bg-primary text-on-primary py-4 font-bold uppercase tracking-widest text-sm hover:bg-primary-container transition-colors duration-200 active:scale-[0.98]" type="submit">
                        Login
                    </button>
</div>
</form>
<!-- Role Indicator -->
<div class="mt-10 flex flex-col items-center space-y-4">
<p class="text-[10px] font-bold uppercase tracking-widest text-outline">Masuk sebagai:</p>
<div class="flex items-center space-x-6">
<div class="flex items-center space-x-2">
<div class="w-2 h-2 bg-primary"></div>
<span class="text-[11px] font-bold uppercase tracking-tight text-primary">Satpam</span>
</div>
<div class="flex items-center space-x-2 opacity-40">
<div class="w-2 h-2 border border-primary"></div>
<span class="text-[11px] font-bold uppercase tracking-tight text-primary">Developer</span>
</div>
</div>
</div>
</div>
<!-- Footer Decoration / Wireframe Element -->
<div class="mt-12 w-full grid grid-cols-3 gap-1 opacity-20">
<div class="h-px bg-outline"></div>
<div class="h-px bg-outline"></div>
<div class="h-px bg-outline"></div>
</div>
<div class="mt-6 text-center">
<p class="text-[9px] text-outline font-medium tracking-[0.2em] uppercase">Architecture System v2.4.0 // Grayscale Protocol</p>
</div>
</div>
<!-- Background Decorative Element (Architectural Brutalism) -->
<div class="fixed top-0 left-0 w-full h-full pointer-events-none -z-10 overflow-hidden">
<div class="absolute top-[-10%] left-[-5%] w-[40%] h-[60%] border-r border-b border-outline-variant opacity-10"></div>
<div class="absolute bottom-[-5%] right-[-2%] w-[30%] h-[40%] border-l border-t border-outline-variant opacity-10"></div>
<!-- Abstract Mass Block -->
<div class="absolute top-[20%] right-[10%] w-32 h-96 bg-surface-container-high opacity-5"></div>
<div class="absolute bottom-[10%] left-[15%] w-64 h-12 bg-surface-container-high opacity-5"></div>
</div>
</body></html>
